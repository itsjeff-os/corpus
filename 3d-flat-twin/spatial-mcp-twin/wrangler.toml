# Flat Digital Twin — Cloudflare Workers Config
name = "flat-digital-twin"
main = "src/worker.ts"
compatibility_date = "2024-09-01"

[site]
bucket = "./public"

# Uncomment when ready for KV-backed state (light toggles, annotations)
# [[kv_namespaces]]
# binding = "FLAT_STATE"
# id = "your-kv-namespace-id"

# Uncomment for R2 asset storage (USDZ files, textures)
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "flat-twin-assets"

[build]
command = "echo 'no build step needed for static assets'"
